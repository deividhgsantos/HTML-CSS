<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: "Love";
            src: url('fonts/Cherish.otf') format(oppentype), url(fonts/Cherish.ttf) format(truetype);
            font-weight: normal;
            font-style: normal;
        }

          /* 
            Tipos de Format
            - oppentype (otf)
            - truetype (ttf)
            - embedde-oppentype
            - truetype-aat (Apple Advanced Typography)
            - svg
          */  
        
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Necessitatibus, doloremque? Accusantium, quas corporis earum illo assumenda dolorum quaerat harum magni sit! Perferendis iste velit facere sunt et ducimus reprehenderit tempore!</p>
</body>
</html>
